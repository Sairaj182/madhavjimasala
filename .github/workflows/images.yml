name: Build and publish images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image path
        id: image-path
        shell: bash
        run: |
          image_path="${GITHUB_REPOSITORY,,}"
          printf 'path=%s\n' "$image_path" >> "$GITHUB_OUTPUT"
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.image-path.outputs.path }}-api:${{ github.sha }}
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: NEXT_PUBLIC_API_URL=/api
          tags: ghcr.io/${{ steps.image-path.outputs.path }}-web:${{ github.sha }}
