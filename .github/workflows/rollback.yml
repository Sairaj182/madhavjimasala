name: Roll back production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Previously healthy immutable image SHA
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Roll back through SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters commands="/opt/madhavji/scripts/deploy.sh rollback $RELEASE_SHA" \
            --comment "Madhavji rollback $RELEASE_SHA" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID"
